plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.musicdownloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.musicdownloader"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // ffmpeg-kit 은 native lib 이라 JVM 단위 테스트로는 검증 불가.
        // 실제 기기/에뮬레이터에서만 돌아간다.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1,LICENSE,LICENSE.txt,NOTICE,NOTICE.txt}'
        }
        jniLibs {
            pickFirsts += ['**/libffmpeg.so', '**/libc++_shared.so']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended:1.6.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'

    // 원본 arthenica ffmpeg-kit 은 2025-04 에 Maven Central 에서 삭제됐다(저장소 아카이브).
    // 같은 API/패키지(com.arthenica.ffmpegkit)를 그대로 쓰는 유지보수 포크를 쓴다.
    // groupId 만 다르다. audio 변형에 lame(MP3 인코더)이 포함돼 있고,
    // AAC/Opus 디코딩은 ffmpeg 기본 내장이라 추가 의존성이 필요 없다.
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.7'
    // ffmpeg-kit 의 POM 이 이 의존성을 명시하지 않아 NoClassDefFoundError 가 난다
    // (com.arthenica.smartexception.java.Exceptions). 원본 위키가 지정한 보정이다.
    implementation 'com.arthenica:smart-exception-java:0.2.1'

    testImplementation 'junit:junit:4.13.2'

    // ffmpeg-kit native lib 는 기기에서만 로드되므로 instrumented test 로 검증한다.
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
