name: Cookie watch

# YouTube 쿠키는 자동 갱신이 불가능하다(브라우저 로그인 세션이 필요).
# 대신 매일 상태를 점검하고, 만료됐으면 이슈를 열어 알린다.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Probe cookie
        env:
          YTDL_COOKIES_B64: ${{ secrets.YTDL_COOKIES_B64 }}
        run: python tools/cookie_watch.py
      - name: Publish status for the PWA
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          REPO="navergirugi/python_youtubedownload"
          if [ "$PROBE_OUTCOME" = "success" ]; then STATE=ok; else STATE=expired; fi
          BODY="$(printf '{"ok":%s}' "$([ "$STATE" = ok ] && echo true || echo false)")"
          if gh release view pwa-status --repo "$REPO" >/dev/null 2>&1; then
            gh release edit pwa-status --repo "$REPO" --notes "$BODY" --title "cookie status"
          else
            gh release create pwa-status --repo "$REPO" --title "cookie status" --notes "$BODY"
          fi
          echo "status published: $STATE"
      - name: Open/refresh issue on expiry
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="navergirugi/python_youtubedownload"
          TITLE="⚠️ YouTube 쿠키 만료됨 — 다운로드 불가"
          EXISTING="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number -q '.[0].number' || true)"
          BODY="$(cat <<'EOF'
          ## YouTube 쿠키가 만료됐거나 무효입니다.

          Actions 러너 IP는 유튜브에 봇으로 차단되어 있어, 로그인 쿠키가 없으면
          **다운로드만** 전부 실패합니다(검색은 정상 동작).

          ### 복구
          ```bash
          # 브라우저에서 YouTube 로그인 → 'Get cookies.txt LOCALLY' 확장 → cookies.txt
          ./tools/setup_pwa_cookie.sh ~/Downloads/cookies.txt
          ```
          이 실행은 이 이슈를 자동으로 닫습니다.
          EOF
          )"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$(date -u +%FT%TZ) — 여전히 만료 상태입니다."
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
      - name: Auto-close issue when healthy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="navergirugi/python_youtubedownload"
          N="$(gh issue list --repo "$REPO" --state open --search "YouTube 쿠키 만료 in:title" --json number -q '.[0].number' || true)"
          [ -n "$N" ] && gh issue close "$N" --repo "$REPO" --comment "쿠키 정상 확인 — 자동 종료" || true
