name: yt pot full probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg + deno + yt-dlp plugin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg git
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          pip install -q -r requirements.txt
          pip install -q -U bgutil-ytdlp-pot-provider
      - name: Set up provider server
        run: |
          set -euo pipefail
          cd "$HOME"
          git clone --depth 1 --single-branch --branch 2.0.0 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          cd bgutil-ytdlp-pot-provider/server
          npm ci
          npx tsc
          echo "=== 빌드 산출물 ==="
          ls -la build/generate_once.js
      - name: Prepare cookies
        env:
          YTDL_COOKIES_B64: ${{ secrets.YTDL_COOKIES_B64 }}
        run: |
          printf '%s' "$YTDL_COOKIES_B64" | base64 -d > "$RUNNER_TEMP/cookies.txt"
      - name: Real download with POT provider
        env:
          CK: ${{ runner.temp }}/cookies.txt
        run: |
          python - <<'PY'
          import glob, os, subprocess, sys
          ck = os.environ["CK"]
          url = "https://www.youtube.com/watch?v=rJ5iyzjErr8"
          home = os.path.expanduser("~/bgutil-ytdlp-pot-provider/server")
          for label, extra in (
              ("pot+cookies", ["--cookies", ck,
                              "--extractor-args",
                              f"youtubepot-bgutilscript:server_home={home};youtube:fetch_pot=always"]),
              ("cookies-only", ["--cookies", ck]),
          ):
              out = f"/tmp/o-{label}.%(ext)s"
              cmd = [sys.executable, "-m", "yt_dlp", "-f", "bestaudio/best",
                     "-o", out, "--no-playlist", *extra, url]
              try:
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=420)
              except subprocess.TimeoutExpired:
                  print(f"RESULT {label}=TIMEOUT"); continue
              files = [f for f in glob.glob(f"/tmp/o-{label}.*") if os.path.getsize(f) > 10000]
              blob = p.stdout + p.stderr
              if files:
                  print(f"RESULT {label}=OK bytes={os.path.getsize(files[0])}")
              elif "reloaded" in blob:
                  print(f"RESULT {label}=RELOADED")
              elif "not a bot" in blob:
                  print(f"RESULT {label}=BOTCHECK")
              elif "403" in blob:
                  print(f"RESULT {label}=403")
              else:
                  print(f"RESULT {label}=OTHER {blob.strip()[-160:]}")
              for kw in ("PO Token", "pot", "bgutil"):
                  for line in blob.splitlines():
                      if kw in line and ("error" in line.lower() or "warn" in line.lower() or "generat" in line.lower()):
                          print(f"   [{label}] {line.strip()[:140]}")
          PY
