name: yt format probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg + deno + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          pip install -q -r requirements.txt
      - name: Prepare cookies
        env:
          YTDL_COOKIES_B64: ${{ secrets.YTDL_COOKIES_B64 }}
        run: |
          printf '%s' "$YTDL_COOKIES_B64" | base64 -d > "$RUNNER_TEMP/cookies.txt"
      - name: List formats
        env:
          CK: ${{ runner.temp }}/cookies.txt
        run: |
          python - <<'PY'
          import subprocess, sys
          ck = __import__("os").environ["CK"]
          url = "https://www.youtube.com/watch?v=rJ5iyzjErr8"
          for label, extra in (("with-cookies", ["--cookies", ck]), ("no-cookies", [])):
              p = subprocess.run(
                  [sys.executable, "-m", "yt_dlp", "-F", "--no-warnings", *extra, url],
                  capture_output=True, text=True, timeout=240)
              lines = [l for l in p.stdout.splitlines() if l.strip() and not l.startswith("[")]
              fmt = [l for l in lines if l[:2].strip().isdigit() or l.strip().startswith("audio")]
              print(f"RESULT {label} rc={p.returncode} lines={len(lines)} fmt_rows={len(fmt)}")
              for l in fmt[:6]:
                  print("   " + " ".join(l.split()[:5]))
              if p.returncode != 0:
                  print("   ERR " + (p.stderr.strip()[:120] or "no-stderr"))
          PY
