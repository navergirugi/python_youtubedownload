# Android APK Build Workflow
# Coexists with release.yml (desktop PyInstaller builds).
# This workflow builds a DEBUG APK for sideloading only (YouTube TOS prohibits Play Store distribution).
# Manual dispatch with same `tag` input (e.g. v1.0.1) so `gh release download <tag>` fetches both desktop zips and APK.

name: Android APK (Debug)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리즈 태그 (예: v1.0.1) - release.yml과 동일 태그 사용'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (wrapper validation + caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27c
          build-tools-version: 34.0.0
          cmdline-tools-version: latest

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Build Debug APK
        if: ${{ hashFiles('android/gradlew') != '' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK artifact
        if: ${{ hashFiles('android/app/build/outputs/apk/debug/app-debug.apk') != '' }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MusicDownloader-android.apk

      - name: Upload APK to GitHub Release
        if: ${{ hashFiles('MusicDownloader-android.apk') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: MusicDownloader-android.apk
          generate_release_notes: false
          allow_update: true
          append_body: true

      - name: Fail if android/ not found or build failed
        if: ${{ hashFiles('android/gradlew') == '' || hashFiles('MusicDownloader-android.apk') == '' }}
        run: |
          echo "::error::android/ directory missing or APK build failed. Ensure android/ project exists with gradlew."
          exit 1